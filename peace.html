<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>A Peace From Heart — JANIC AI Idea Lab</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@1,9..144,400;1,9..144,500&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="shared.css">
</head>
<body>
<div class="wrap">
  <div class="page">
    <a class="back-link" href="index.html">← Kembali ke JANIC AI Idea Lab</a>
    <div class="page-meta">J-003 · diusulkan oleh Anonymus</div>
    <div class="page-note">Prototype ini BUKAN alat terapi, diagnosis, atau layanan krisis — hanya latihan menulis reflektif ringan, tanpa histori percakapan tersimpan.</div>
    <div id="tool"></div>
  </div>
</div>

<script>
const PEACE = (function(){
  const MOODS = ["Berat banget","Nggak stabil","Biasa aja","Cukup baik","Baik"];
  const TAGS = ["Cemas","Lelah","Kesepian","Marah","Bingung","Sedih","Tertekan sekolah","Masalah keluarga","Masalah pertemanan"];
  let state, root;
  function init(el){ root = el; state = { mood:null, tags:[] }; render(); }
  function render(){
    root.innerHTML = `
      <div class="theme-peace">
        <div class="p-eyebrow">A Peace From Heart</div>
        <div class="p-disclaimer">Ini bukan pengganti bantuan profesional, dan tidak ada percakapan yang disimpan. Kalau bebanmu terasa berat, bicaralah dengan orang tua, guru, atau konselor sekolah.</div>
        <div class="p-q">Secara umum, gimana perasaanmu hari ini?</div>
        <div class="p-mood-row" id="p-mood-row">${MOODS.map((m,i)=>`<button class="p-mood" onclick="PEACE.pickMood(${i}, this)">${m}</button>`).join('')}</div>
        <div class="p-q" style="font-size:15.5px;">Ada rasa yang lebih spesifik? (opsional)</div>
        <div class="p-tag-row" id="p-tag-wrap">${TAGS.map(t=>`<button class="p-tag" onclick="PEACE.toggleTag('${t}', this)">${t}</button>`).join('')}</div>
        <textarea class="p-textarea" id="p-text" placeholder="Ingin cerita lebih lanjut? tulis di sini…" rows="2"></textarea>
        <div class="p-err" id="p-err" style="display:none;">Pilih mood dulu, atau tulis sesuatu sebelum kirim.</div>
        <button class="p-send" onclick="PEACE.submit()">Kirim ke ruang refleksi</button>
        <div class="loading" id="p-loading" style="color:#8f7a80; text-align:center;">Menyusun refleksi dengan hati-hati…</div>
      </div>`;
  }
  function pickMood(i, btn){ state.mood = i; document.querySelectorAll('#p-mood-row .p-mood').forEach(b=>b.classList.remove('selected')); btn.classList.add('selected'); }
  function toggleTag(t, btn){ const idx = state.tags.indexOf(t); if(idx>-1){ state.tags.splice(idx,1); btn.classList.remove('selected'); } else { state.tags.push(t); btn.classList.add('selected'); } }
  async function submit(){
    const text = document.getElementById('p-text').value.trim();
    const err = document.getElementById('p-err');
    if(state.mood===null && !text){ err.style.display='block'; return; }
    err.style.display='none';
    const loading = document.getElementById('p-loading');
    loading.className = 'loading show';
    try{
      const sys = "Kamu teman menulis reflektif untuk remaja Indonesia — BUKAN terapis, BUKAN konselor, BUKAN layanan krisis, dan tidak memberi diagnosis atau nasihat klinis. Balas dengan 3-4 kalimat: 1-2 kalimat validasi perasaan yang hangat dan tidak menghakimi, lalu satu pertanyaan reflektif terbuka. Jika teks menunjukkan tanda krisis atau keinginan menyakiti diri, jangan coba menangani sendiri — dorong dengan jelas dan segera untuk bicara dengan orang dewasa tepercaya, guru BK, atau layanan bantuan profesional. Bahasa Indonesia, tenang, singkat.";
      const userMsg = `Mood: ${state.mood!==null ? MOODS[state.mood] : '(tidak memilih)'}\nRasa yang dipilih: ${state.tags.join(', ') || '(tidak memilih tag)'}\nCerita tambahan: ${text || '(tidak menulis apa-apa)'}`;
      const response = await fetch("https://api.anthropic.com/v1/messages", { method:"POST", headers:{"Content-Type":"application/json"}, body: JSON.stringify({ model:"claude-sonnet-4-6", max_tokens:400, system: sys, messages:[{role:"user", content: userMsg}] }) });
      const data = await response.json();
      const out = (data.content||[]).filter(b=>b.type==='text').map(b=>b.text).join('\n') || "Terima kasih sudah mau berbagi. Apa satu hal kecil yang bisa bikin hari ini terasa sedikit lebih ringan?";
      renderResult(out);
    }catch(e){ loading.textContent = "Gagal memuat refleksi. Coba lagi."; }
  }
  function renderResult(out){
    root.innerHTML = `
      <div class="theme-peace">
        <div class="p-eyebrow">A Peace From Heart</div>
        <div class="p-reflection">"${out}"</div>
        <div class="p-closing">Tarik napas pelan tiga kali sebelum lanjut ke aktivitasmu.</div>
        <div class="p-closing">Kalau perasaan ini terasa berat atau terus-menerus, bicara dengan orang tua, guru, atau konselor sekolah tetap langkah terbaik.</div>
        <button class="p-again" onclick="PEACE.init(root)">↻ Tulis lagi</button>
      </div>`;
  }
  return { init, pickMood, toggleTag, submit };
})();

PEACE.init(document.getElementById('tool'));
</script>
</body>
</html>
